<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>
    Báo cáo Giải Ngân | Ban QLDA Giao thông & Nông nghiệp Đà Nẵng
  </title>

  <style>

    /* =========================================================
       RESET
    ========================================================= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;

      font-family:
        "Segoe UI",
        system-ui,
        Arial,
        sans-serif;

      background: #e8ecf1;
    }


    /* =========================================================
       HEADER
       MÀU XANH THEO MẪU LOGO
    ========================================================= */
    .topbar {

      width: 100%;
      height: 56px;

      background: #0661B6;

      padding: 0 24px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      flex-shrink: 0;

      box-shadow:
        0 2px 8px rgba(0,0,0,.18);

      position: relative;
      z-index: 10;
    }


    /* =========================================================
       LOGO + BRAND
    ========================================================= */
    .brand {

      display: flex;
      align-items: center;

      gap: 12px;

      min-width: 0;
    }


    /* LOGO */
    .seal {

      width: 42px;
      height: 42px;

      border-radius: 50%;

      overflow: hidden;

      background: #ffffff;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-shrink: 0;

      border: 2px solid
        rgba(255,255,255,.75);

      box-shadow:
        0 1px 5px rgba(0,0,0,.25);
    }


    .seal img {

      width: 100%;
      height: 100%;

      object-fit: contain;

      display: block;
    }


    /* =========================================================
       BRAND TEXT
    ========================================================= */
    .brand-txt {

      min-width: 0;
    }


    .brand-txt strong {

      display: block;

      font-size: 13px;

      font-weight: 700;

      color: #ffffff;

      line-height: 1.25;

      white-space: nowrap;

      letter-spacing: .15px;
    }


    .brand-txt span {

      display: block;

      margin-top: 2px;

      font-size: 10px;

      color:
        rgba(255,255,255,.78);

      line-height: 1.2;

      white-space: nowrap;
    }


    /* =========================================================
       HEADER RIGHT
    ========================================================= */
    .topbar-right {

      display: flex;
      align-items: center;

      gap: 10px;

      flex-shrink: 0;
    }


    /* KH 2026 */
    .badge {

      display: inline-flex;
      align-items: center;

      height: 27px;

      padding: 0 12px;

      font-size: 10px;

      font-weight: 600;

      color: #ffffff;

      background:
        rgba(255,255,255,.14);

      border:
        1px solid rgba(255,255,255,.25);

      border-radius: 15px;

      white-space: nowrap;
    }


    /* DATE */
    .date {

      display: inline-flex;
      align-items: center;

      height: 27px;

      padding: 0 12px;

      font-size: 10px;

      color: #ffffff;

      background:
        rgba(255,255,255,.10);

      border:
        1px solid rgba(255,255,255,.20);

      border-radius: 15px;

      white-space: nowrap;
    }


    /* =========================================================
       MAIN DASHBOARD
    ========================================================= */
    .main-wrap {

      width: 100%;

      height:
        calc(100vh - 84px);

      padding:
        7px 8px 7px 8px;

      background: #e8ecf1;
    }


    /* =========================================================
       IFRAME CONTAINER
    ========================================================= */
    .iframe-container {

      position: relative;

      width: 100%;
      height: 100%;

      background: #ffffff;

      border-radius: 10px;

      overflow: hidden;

      box-shadow:
        0 2px 16px rgba(0,0,0,.08);
    }


    .iframe-container iframe {

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      border: 0;

      display: block;
    }


    /* =========================================================
       FOOTER
       CÙNG MÀU HEADER
    ========================================================= */
    .footer {

      width: 100%;

      height: 28px;

      background: #0661B6;

      color:
        rgba(255,255,255,.92);

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 0 12px;

      font-size: 9px;

      font-weight: 500;

      letter-spacing: .1px;

      flex-shrink: 0;
    }


    /* =========================================================
       TABLET
    ========================================================= */
    @media (max-width: 768px) {

      .topbar {

        height: 50px;

        padding: 0 14px;
      }


      .seal {

        width: 34px;
        height: 34px;
      }


      .brand {

        gap: 9px;
      }


      .brand-txt strong {

        font-size: 11px;

        max-width: 230px;

        overflow: hidden;

        text-overflow: ellipsis;
      }


      .brand-txt span {

        display: none;
      }


      .badge {

        height: 24px;

        padding: 0 9px;

        font-size: 9px;
      }


      .date {

        height: 24px;

        padding: 0 9px;

        font-size: 9px;
      }


      .main-wrap {

        height:
          calc(100vh - 78px);

        padding:
          4px 4px 5px 4px;
      }


      .iframe-container {

        border-radius: 7px;
      }


      .footer {

        height: 28px;

        font-size: 8px;
      }
    }


    /* =========================================================
       MOBILE
    ========================================================= */
    @media (max-width: 480px) {

      .topbar {

        height: 46px;

        padding: 0 10px;
      }


      .seal {

        width: 30px;
        height: 30px;
      }


      .brand {

        gap: 7px;
      }


      .brand-txt strong {

        font-size: 10px;

        max-width: 145px;
      }


      .brand-txt span {

        display: none;
      }


      .badge {

        display: none;
      }


      .date {

        height: 22px;

        padding: 0 8px;

        font-size: 9px;
      }


      .main-wrap {

        height:
          calc(100vh - 72px);

        padding:
          3px 3px 4px 3px;
      }


      .iframe-container {

        border-radius: 5px;
      }


      .footer {

        height: 26px;

        font-size: 7.5px;

        white-space: nowrap;

        overflow: hidden;

        text-overflow: ellipsis;
      }
    }


    /* =========================================================
       VERY SMALL MOBILE
    ========================================================= */
    @media (max-width: 360px) {

      .brand-txt strong {

        max-width: 120px;
      }


      .date {

        font-size: 8px;

        padding: 0 6px;
      }


      .footer {

        font-size: 7px;
      }
    }

  </style>
</head>


<body>


  <!-- =======================================================
       HEADER
  ======================================================== -->
  <header class="topbar">


    <!-- LOGO + TÊN BAN -->
    <div class="brand">

      <div class="seal">

        <img
          src="logobgtnn.png"
          alt="Logo Ban QLDA Giao thông và Nông nghiệp Đà Nẵng"
        >

      </div>


      <div class="brand-txt">

        <strong>
          BAN GIAO THÔNG &amp; NÔNG NGHIỆP ĐN
        </strong>

        <span>
          Báo cáo Giải Ngân · Kế hoạch 2026
        </span>

      </div>

    </div>


    <!-- THÔNG TIN BÊN PHẢI -->
    <div class="topbar-right">

      <span class="badge">
        📊 KH 2026
      </span>


      <span
        class="date"
        id="currentDate"
      >
        --
      </span>

    </div>

  </header>



  <!-- =======================================================
       DASHBOARD LOOKER STUDIO
  ======================================================== -->
  <main class="main-wrap">

    <div class="iframe-container">

      <iframe
        src="https://datastudio.google.com/embed/reporting/5634896d-227b-43c8-8eb4-225370996309/page/QnN5F"
        title="Báo cáo Giải Ngân - Kế hoạch 2026"
        allowfullscreen
        sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">
      </iframe>

    </div>

  </main>



  <!-- =======================================================
       FOOTER
  ======================================================== -->
  <footer class="footer">

    BAN GIAO THÔNG &amp; NÔNG NGHIỆP ĐÀ NẴNG
    &nbsp;·&nbsp;
    HỆ THỐNG BÁO CÁO GIẢI NGÂN
    &nbsp;·&nbsp;
    KẾ HOẠCH VỐN 2026

  </footer>



  <!-- =======================================================
       JAVASCRIPT
  ======================================================== -->
  <script>

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        const now = new Date();


        const options = {

          day: "2-digit",

          month: "2-digit",

          year: "numeric"

        };


        const dateElement =
          document.getElementById(
            "currentDate"
          );


        if (dateElement) {

          dateElement.textContent =
            now.toLocaleDateString(
              "vi-VN",
              options
            );

        }

      }
    );

  </script>


</body>
</html>
